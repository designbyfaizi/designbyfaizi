process:
  title: How a job runs
  steps:
    - title: Brief
      text: We talk it through first. What the thing is for, who it's for, and what good looks like.
    - title: Sketch
      text: Layouts, type and colour come together in design tools until the idea has a shape you can react to.
    - title: Build
      text: The design becomes real software with modern frameworks, built to be fast, intuitive and scalable.
    - title: Deploy
      text: It goes live on the internet, and I stay close to tune it, fix it and keep it running.
