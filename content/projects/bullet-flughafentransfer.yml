title: Bullet Flughafentransfer
type: Web App
description: A full booking platform for an airport transfer company in Darmstadt. Customers get an instant fixed price from a Google Maps route, book in German or English and manage their rides in an account. Behind it sit an admin panel for bookings and customers, PDF invoices with VAT, automated emails and SEO pages for each city served.
